syntax = "proto3";

package gateway.v1;

import "google/api/annotations.proto";
import "user-service.proto";

option go_package = "gen/gateway";

service GatewayService {
  rpc RegisterUser(user_service.v1.RegisterUserRequest) returns (user_service.v1.RegisterUserResponse) {
    option (google.api.http) = {
      post: "/api/register"
      body: "*"
    };
  }

  rpc LoginUser(user_service.v1.LoginUserRequest) returns (user_service.v1.LoginUserResponse) {
    option (google.api.http) = {
      post: "/api/login"
      body: "*"
    };
  }

  rpc VerifyAccount(user_service.v1.VerifyAccountRequest) returns (user_service.v1.VerifyAccountResponse) {
    option (google.api.http) = {get: "/api/verify/{token}"};
  }

  rpc RequestMagicLink(user_service.v1.RequestMagicLinkRequest) returns (user_service.v1.RequestMagicLinkResponse) {
    option (google.api.http) = {
      post: "/api/auth/magic-link/request"
      body: "*"
    };
  }

  rpc VerifyMagicLink(user_service.v1.VerifyMagicLinkRequest) returns (user_service.v1.LoginUserResponse) {
    option (google.api.http) = {
      post: "/api/auth/magic-link/verify"
      body: "*"
    };
  }

  rpc ChangePassword(user_service.v1.ChangePasswordRequest) returns (user_service.v1.ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/api/auth/password-reset"
      body: "*"
    };
  }

  rpc Verify2FA(user_service.v1.Verify2FARequest) returns (user_service.v1.Verify2FAResponse) {
    option (google.api.http) = {
      post: "/api/twofactor/verify"
      body: "*"
    };
  }
}
