services:
  api-gateway:
    container_name: "api-gateway"
    build:
      context: ..
      dockerfile: ./backend/api-gateway/Dockerfile
    env_file:
      - ./api-gateway/.env
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
      - "8080:8080"
    depends_on:
      - user-service
    networks:
      - user-network

  user-service:
    container_name: "user-service"
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    env_file:
      - ./user-service/.env
    user: "1000:1000"
    volumes:
      - ./user-service/logs:/app/logs
    logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"
    networks:
      - user-network
  user-mongo:
    image: mongo:latest
    container_name: user-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_DB_PASS}
    volumes:
      - user-data:/data/db
    restart: unless-stopped
    networks:
      - user-network

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: filesify-silo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - silo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]      
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - storage-network

  data-storage-service:
    build: ./data-storage-service
    container_name: filesify-storage
    ports:
      - "${DATA_STORAGE_PORT}:8083" # TEMPORARY: Remove this once api-gateway is ready
    env_file:
      - .env
    environment:
      - SILO_ENDPOINT=${SILO_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      silo:
        condition: service_healthy
    networks:
      - storage-network

networks:
  user-network: #isolated user network
  storage-network: #isolated storage network

volumes:
  user-data:
  silo-data:    