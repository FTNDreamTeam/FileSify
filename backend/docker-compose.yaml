services:
  user-service:
    build: ./user-service
    env_file:
      - ./user-service/.env
    ports:
      - "${PORT}:8082"
    environment:
      - MONGO_URI=${MONGO_URI}
    networks:
      - user-network
  user-mongo:
    image: mongo:latest
    container_name: user-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_DB_PASS}
    volumes:
      - user-data:/data/db
    restart: unless-stopped
    networks:
      - user-network

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: filesify-silo
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - silo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]      
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  user-network: #isolated user network

volumes:
  user-data:
  silo-data:    