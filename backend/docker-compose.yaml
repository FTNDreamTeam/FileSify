services:
  api-gateway:
    container_name: "api-gateway"
    build:
      context: ..
      dockerfile: ./backend/api-gateway/Dockerfile
    env_file:
      - ./api-gateway/.env
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
      - "${UI_PORT}:${UI_PORT}"
    depends_on:
      - user-service
    networks:
      - user-network
      - storage-network
  user-service:
    container_name: "user-service"
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    env_file:
      - ./user-service/.env
    user: "1000:1000"
    volumes:
      - ./user-service/logs:/app/logs
    logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"
    networks:
      - user-network
      - mail-network
      - storage-network
    depends_on:
      - user-mongo

  user-mongo:
    image: mongo:latest
    container_name: user-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_DB_PASS}
    volumes:
      - user-data:/data/db
    restart: unless-stopped
    networks:
      - user-network

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: filesify-silo
    command: server /data --console-address ":9001"
    ports:
      - "${SILO_CONSOLE_PORT}:${SILO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - silo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]      
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - storage-network

  data-storage-service:
    build:
      context: .
      dockerfile: ./data-storage-service/Dockerfile
    container_name: filesify-storage
    env_file:
      - ./data-storage-service/.env
    depends_on:
      silo:
        condition: service_healthy
      data-service-mongo:
        condition: service_healthy
    networks:
      - storage-network

  data-service-mongo:
    image: mongo:latest
    container_name: storage-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${STORAGE_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${STORAGE_MONGO_PASS}
    volumes:
      - silo-data:/data/meta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${STORAGE_MONGO_USERNAME}", "-p", "${STORAGE_MONGO_PASS}", "--authenticationDatabase", "admin", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s
    networks:
      - storage-network

  mail-service:
    build:
      context: .
      dockerfile: ./mail-service/Dockerfile
    container_name: mail-service
    env_file:
      - ./mail-service/.env
    networks:
      - mail-network
    depends_on:
      - mailhog

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "${MAILHOG_UI_PORT}:${MAILHOG_UI_PORT}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    networks:
      - mail-network

  redis-otp:
    image: redis:7-alpine
    container_name: redis-otp
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - user-network

networks:
  user-network: #isolated user network
  storage-network: #isolated storage network
  mail-network: #isolated mail network

volumes:
  user-data:
  silo-data: