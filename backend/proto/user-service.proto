syntax = "proto3";

package user_service.v1;

import "google/date.proto";

option go_package = "gen/user-service-gen";

service UserService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse) {}
}

message UserProfile {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  google.type.Date password_valid = 5;
}

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message RegisterUserResponse {
  UserProfile user = 1;
  string message = 2;
}

message LoginUserRequest {
  string email = 1;
  string password = 2;
}

message LoginUserResponse {
  string token = 1;
  UserProfile user = 2;
}
