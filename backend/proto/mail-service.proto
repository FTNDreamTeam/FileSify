syntax = "proto3";

package mail_service.v1;

import "user-service.proto";

option go_package = "gen/mail-service";

service MailService {
  rpc SendVerification(user_service.v1.SendVerificationRequest) returns (user_service.v1.SendVerificationResponse) {}
  rpc SendMagicLink(user_service.v1.SendMagicLinkRequest) returns (user_service.v1.SendMagicLinkResponse) {}
  rpc SendTwoFactor(user_service.v1.SendTwoFactorRequest) returns (user_service.v1.SendTwoFactorResponse) {}
}
