services:
  api-gateway:
    container_name: "api-gateway"
    build:
      context: ..
      dockerfile: ./backend/api-gateway/Dockerfile
    env_file:
      - ./api-gateway/.env
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
      - "8080:8080"
    depends_on:
      - user-service
    networks:
      - user-network

  user-service:
    container_name: "user-service"
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    env_file:
      - ./user-service/.env
    networks:
      - user-network
  user-mongo:
    image: mongo:latest
    container_name: user-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_DB_PASS}
    volumes:
      - user-data:/data/db
    restart: unless-stopped
    networks:
      - user-network

networks:
  user-network: #isolated user network

volumes:
  user-data:    