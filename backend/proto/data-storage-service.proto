syntax = "proto3";

package storage.v1;

import "google/date.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/data-storage-service-gen";

service StorageService {
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc RenameFolder(RenameFolderRequest) returns (RenameFolderResponse);
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
}

message CreateFolderRequest {
  string path = 1;
  optional string token = 2;
}

message CreateFolderResponse {}

message FileMetaData {
  string name = 1;
  string mime_type = 2;
  string path = 3;
  google.type.Date date_created_at = 4;
  google.protobuf.Timestamp time_created_at = 5;
  string user_id = 6;
}

message UploadFileRequest {
  oneof data {
    FileMetaData metadata = 1;
    bytes content = 2;
  }
}

message UploadFileResponse {}

message ChangeQuotaRequest {
  int32 amount = 1;
  string user_id = 2;
}

message CheckStorageQuotaRequest {
  string user_id = 1;
}

message CheckStorageQuotaResponse {
  int32 quota = 1;
}

message ListFilesRequest {
  string path = 1;
  optional string token = 2;
}

message FileInfo {
  string name = 1;
  bool is_directory = 2;
  int64 size = 3;
  string path = 4;
}

message ListFilesResponse {
  repeated FileInfo files = 1;
}

message RenameFolderRequest {
  string old_path = 1;
  string new_path = 2;
  optional string token = 3;
}

message RenameFolderResponse {}

message RenameFileRequest {
  string old_path = 1;
  string new_name = 2;
  optional string token = 3;
}

message RenameFileResponse {}
