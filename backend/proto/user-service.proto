syntax = "proto3";

package user_service.v1;

import "data-storage-service.proto";
import "google/date.proto";

option go_package = "gen/user-service-gen";

service UserService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse) {}
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse) {}
  rpc SendVerification(SendVerificationRequest) returns (SendVerificationResponse) {}
  rpc VerifyAccount(VerifyAccountRequest) returns (VerifyAccountResponse) {}
  rpc RequestMagicLink(RequestMagicLinkRequest) returns (RequestMagicLinkResponse) {}
  rpc VerifyMagicLink(VerifyMagicLinkRequest) returns (LoginUserResponse) {}
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {}
  rpc SendTwoFactor(SendTwoFactorRequest) returns (SendTwoFactorResponse) {}
  rpc Verify2FA(Verify2FARequest) returns (Verify2FAResponse) {}
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {}
  rpc IncreaseStorageQuota(storage.v1.ChangeQuotaRequest) returns (EmptyResponse) {} //Admin accepts users storage expansion request
  rpc DecreaseStorageQuota(storage.v1.ChangeQuotaRequest) returns (EmptyResponse) {} //When admin decides to decrease users storage quota
  rpc ChangeUsedQuota(storage.v1.ChangeQuotaRequest) returns (EmptyResponse) {} //When file gets uploaded/deleted changes the amount of storage used by user
  rpc CheckStorageQuota(storage.v1.CheckStorageQuotaRequest) returns (storage.v1.CheckStorageQuotaResponse) {} //Checks users remaining storage quota
  rpc ListExpansionReq(ListExpansionReqRequest) returns (ListExpansionReqResponse) {}
  rpc CreateExpansionReq(CreateExpansionReqRequest) returns (CreateExpansionReqResponse) {}
  rpc HandleExpansionReq(HandleExpansionReqRequest) returns (HandleExpansionReqResponse) {}
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}
}

message UserProfile {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  google.type.Date password_valid = 6;
  int32 storage_quota = 7;
  int32 used_quota = 8;
  string role = 9;
}

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message RegisterUserResponse {
  UserProfile user = 1;
  string message = 2;
}

message LoginUserRequest {
  string email = 1;
  string password = 2;
}

message LoginUserResponse {
  string token = 1;
  bool two_factor = 2;
  UserProfile user = 3;
}

message SendVerificationRequest {
  string email = 1;
  string username = 2;
  string verification_url = 3;
  int64 expires_at_unix = 4;
}

message SendVerificationResponse {
  string message = 1;
}

message VerifyAccountRequest {
  string token = 1;
}

message VerifyAccountResponse {
  string message = 1;
}

message RequestMagicLinkRequest {
  string email = 1;
}

message RequestMagicLinkResponse {
  string message = 1;
}

message VerifyMagicLinkRequest {
  string token = 1;
}

message SendMagicLinkRequest {
  string email = 1;
  string username = 2;
  string magic_link_url = 3;
  int64 expires_at_unix = 4;
}

message SendMagicLinkResponse {
  string message = 1;
}

message ChangePasswordRequest {
  string email = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  string message = 1;
}

message SendTwoFactorRequest {
  string email = 1;
  string code = 2;
  string name = 3;
}

message SendTwoFactorResponse {
  string message = 1;
}

message Verify2FARequest {
  string pending_token = 1;
  string code = 2;
}

message Verify2FAResponse {
  string token = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;
  string role = 2;
}

message EmptyResponse {}

message StorageExpansionRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  uint32 amount = 4;
  uint64 storage_quota = 5;
  uint64 used_quota = 6;
  uint32 role = 7;
  uint32 status = 8;
}

message ListExpansionReqRequest {}

message ListExpansionReqResponse {
  repeated StorageExpansionRequest requests = 1;
}

message CreateExpansionReqRequest {
  uint32 amount = 1;
}

message CreateExpansionReqResponse {
  string message = 1;
}

message HandleExpansionReqRequest {
  string email = 1;
  bool approve = 2;
}

message HandleExpansionReqResponse {
  string message = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserProfile users = 1;
}